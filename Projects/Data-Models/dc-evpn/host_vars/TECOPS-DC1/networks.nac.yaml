---
# Overlay networks: one subnet per VRF, stretched across the leaves.
# gw_ip_address is the anycast gateway: the same default gateway on every leaf.
# net_id is the L2 VNI. Always set vlan_id yourself (2300-2999) to avoid clashes.
# The IP Core fusion snippets export these subnets into the core global table; keep them in step.
vxlan:
  overlay:
    networks:
      - name: RedNetwork1
        vrf_name: red
        net_id: 30000
        vlan_id: 2300
        is_l2_only: false
        vlan_name: RedNetwork1
        int_desc: RedNetwork1
        gw_ip_address: "10.200.10.1/24"
        network_attach_group: red_vpc5

      - name: GreenNetwork1
        vrf_name: green
        net_id: 30001
        vlan_id: 2301
        is_l2_only: false
        vlan_name: GreenNetwork1
        int_desc: GreenNetwork1
        gw_ip_address: "10.200.20.1/24"
        network_attach_group: green_vpc6

      - name: BlueNetwork1
        vrf_name: blue
        net_id: 30002
        vlan_id: 2302
        is_l2_only: false
        vlan_name: BlueNetwork1
        int_desc: BlueNetwork1
        gw_ip_address: "10.200.30.1/24"
        network_attach_group: blue_vpc7

    # Attach groups: which host ports each network reaches. Each lists the same
    # vPC port-channel on both leaves; the port-channels are defined in topology_switches.
    network_attach_groups:
      - name: red_vpc5
        switches:
          - hostname: dc-leaf1
            ports:
              - Port-channel5
          - hostname: dc-leaf2
            ports:
              - Port-channel5

      - name: green_vpc6
        switches:
          - hostname: dc-leaf1
            ports:
              - Port-channel6
          - hostname: dc-leaf2
            ports:
              - Port-channel6

      - name: blue_vpc7
        switches:
          - hostname: dc-leaf1
            ports:
              - Port-channel7
          - hostname: dc-leaf2
            ports:
              - Port-channel7
