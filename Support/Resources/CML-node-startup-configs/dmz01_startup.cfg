! =============================================================
! Startup Configuration - dmz1
! Purpose : Minimal config for Catalyst Center discovery
! Mgmt IP : 198.18.128.107/24  GW: 198.18.128.1
! Loopback0: 198.18.129.200/32
! Generated: 2026-03-03
! =============================================================

hostname dmz1

! --- Management VRF ---
vrf definition Mgmt-vrf
 !
 address-family ipv4
 exit-address-family

! --- Domain (required for SSH key generation) ---
ip domain name dcloud.cisco.com

ip routing

! --- AAA ---
aaa new-model
aaa authentication login default local
aaa authorization exec default local

! --- Local credentials ---
username net-admin privilege 15 secret cisco
username cisco privilege 15 secret cisco

! --- Loopback0 (routing/OSPF router-id) ---
interface Loopback0
 description Routing Loopback
 ip address 198.18.129.200 255.255.255.255
 ip ospf 1 area 0

! --- Core-facing interfaces ---
interface GigabitEthernet1/0/1
 description Core1
 no switchport
 ip address 198.18.130.66 255.255.255.252
 ip pim sparse-mode
 ip ospf network point-to-point
 ip ospf 1 area 0
 no shutdown
!
interface GigabitEthernet1/0/2
 description Core2
 no switchport
 ip address 198.18.130.70 255.255.255.252
 ip pim sparse-mode
 ip ospf network point-to-point
 ip ospf 1 area 0
 no shutdown
!
interface GigabitEthernet1/0/3
 description FW
 no switchport
 ip address 198.18.130.73 255.255.255.252
 no shutdown

! --- Management interface ---
interface GigabitEthernet0/0
 vrf forwarding Mgmt-vrf
 ip address 198.18.128.107 255.255.255.0
 negotiation auto
 no shutdown

! --- Default route in Mgmt-vrf ---
ip route vrf Mgmt-vrf 0.0.0.0 0.0.0.0 198.18.128.1

! --- BGP ---
router bgp 65003
 template peer-policy PEER-POLICY
  soft-reconfiguration inbound
 exit-peer-policy
 !
 template peer-session PEER-SESSION
  remote-as 65002
  ebgp-multihop 4
  update-source Loopback0
 exit-peer-session
 !
 bgp router-id interface Loopback0
 bgp log-neighbor-changes
 neighbor 198.18.129.8 remote-as 65002
 neighbor 198.18.129.8 inherit peer-session PEER-SESSION
 neighbor 198.18.129.9 remote-as 65002
 neighbor 198.18.129.9 inherit peer-session PEER-SESSION
 !
 address-family ipv4
  redistribute connected route-map TO-BGP
  neighbor 198.18.129.8 activate
  neighbor 198.18.129.8 inherit peer-policy PEER-POLICY
  neighbor 198.18.129.9 activate
  neighbor 198.18.129.9 inherit peer-policy PEER-POLICY
 exit-address-family

! --- Route-map for BGP redistribution ---
route-map TO-BGP permit 10
 match interface Loopback0
!
route-map TO-BGP permit 20
 match interface Vlan120

! --- OSPF ---
router ospf 1
 router-id 198.18.129.200
!
! --- SSH version 2 ---
crypto key generate rsa modulus 2048
ip ssh version 2

! --- VTY lines - SSH only ---
line vty 0 15
 login authentication default
 transport input ssh
 exec-timeout 10 0

! --- SNMP ---
snmp-server community RO RO
snmp-server community RW RW
