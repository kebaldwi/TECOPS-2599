! core1 - DC VRF-Lite handoff and VRF fusion (incremental snippet)
!
! Pairs with the dc-evpn pipeline (Support/Resources/Ansible/dc-evpn): dc-border1 Ethernet1/3
! carries VRFs red/green/blue to this core on Ethernet1/7 (dot1q 2/3/4, eBGP 65002 <-> 65005).
! Each VRF exports the DC subnets into the global table (DC-FUSION-EXPORT) and imports the
! global table, minus the DC subnets, back in (DC-FUSION-IMPORT). Keep the addresses in step
! with dc-evpn/inventory/group_vars/all/dc_vrf_lite.yml and the subnets with networks.nac.yaml.
!
! Apply: paste in configuration mode (configure terminal), then copy running-config startup-config.
! Requires: feature bgp and router bgp 65002 (already in core1.cfg); parent Ethernet1/7 routed.
!
ip prefix-list DC-FUSION-SEGMENTS seq 10 permit 10.200.10.0/24
ip prefix-list DC-FUSION-SEGMENTS seq 20 permit 10.200.20.0/24
ip prefix-list DC-FUSION-SEGMENTS seq 30 permit 10.200.30.0/24
route-map DC-FUSION-EXPORT permit 10
  match ip address prefix-list DC-FUSION-SEGMENTS
route-map DC-FUSION-IMPORT deny 10
  match ip address prefix-list DC-FUSION-SEGMENTS
route-map DC-FUSION-IMPORT permit 20
vrf context red
  address-family ipv4 unicast
    import vrf default map DC-FUSION-IMPORT
    export vrf default map DC-FUSION-EXPORT
vrf context green
  address-family ipv4 unicast
    import vrf default map DC-FUSION-IMPORT
    export vrf default map DC-FUSION-EXPORT
vrf context blue
  address-family ipv4 unicast
    import vrf default map DC-FUSION-IMPORT
    export vrf default map DC-FUSION-EXPORT
interface Ethernet1/7.2
  description DC red to dc-border1 Ethernet1/3.2
  encapsulation dot1q 2
  vrf member red
  ip address 198.19.4.2/30
  no shutdown
interface Ethernet1/7.3
  description DC green to dc-border1 Ethernet1/3.3
  encapsulation dot1q 3
  vrf member green
  ip address 198.19.4.6/30
  no shutdown
interface Ethernet1/7.4
  description DC blue to dc-border1 Ethernet1/3.4
  encapsulation dot1q 4
  vrf member blue
  ip address 198.19.4.10/30
  no shutdown
router bgp 65002
  vrf red
    address-family ipv4 unicast
    neighbor 198.19.4.1
      remote-as 65005
      description dc-border1 red
      address-family ipv4 unicast
  vrf green
    address-family ipv4 unicast
    neighbor 198.19.4.5
      remote-as 65005
      description dc-border1 green
      address-family ipv4 unicast
  vrf blue
    address-family ipv4 unicast
    neighbor 198.19.4.9
      remote-as 65005
      description dc-border1 blue
      address-family ipv4 unicast
!
! Rollback (configuration mode):
!   router bgp 65002
!     no vrf red
!     no vrf green
!     no vrf blue
!   no interface Ethernet1/7.2
!   no interface Ethernet1/7.3
!   no interface Ethernet1/7.4
!   no vrf context red
!   no vrf context green
!   no vrf context blue
!   no route-map DC-FUSION-IMPORT
!   no route-map DC-FUSION-EXPORT
!   no ip prefix-list DC-FUSION-SEGMENTS
