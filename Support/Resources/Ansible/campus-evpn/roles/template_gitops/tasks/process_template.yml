---
# process-template.yml
# Processes individual template files and builds workflow manager configuration

- name: Extract template metadata for {{ template_file.name }}
  ansible.builtin.set_fact:
    template_gitops_template_name: "{{ template_file.name }}"
    template_gitops_template_content_raw: "{{ template_file.content | replace('{{ TEMPLATE_PROJECT_NAME }}', project_name) }}"
    template_gitops_commit_message: "{{ template_file.commit_message }}"
    template_gitops_diff_content_raw: >-
      {{ template_file.diff_content | regex_replace('([^\n]+)', '{## \1 ##}')
         + '\n'
         if include_diff_header and template_file.diff_content
         else '' }}

- name: Assemble final template content for {{ template_gitops_template_name }}
  ansible.builtin.set_fact:
    template_gitops_template_content: "{{ template_gitops_diff_content_raw }}{{ template_gitops_template_content_raw }}"

- name: Build template workflow configuration for {{ template_gitops_template_name }}
  ansible.builtin.set_fact:
    template_gitops_template_workflow_configs: "{{ template_gitops_template_workflow_configs | default([]) + [template_config] }}"
  vars:
    template_config:
      configuration_templates:
        template_name: "{{ template_gitops_template_name }}"
        project_name: "{{ project_name }}"
        language: "JINJA"
        template_content: "{{ template_gitops_template_content }}"
        # template_content_file_path: "{{ processed_template_path }}"
        template_description: >-
          {{ 'Template synced from local folder ' + (template_local_dir | basename)
             if template_source | default('git') == 'local'
             else 'Template synced from Git ' + git_repo + ' repository, branch ' + git_branch }}
        device_types: "{{ default_device_types }}"
        software_type: "{{ default_software_type }}"
        software_variant: "{{ default_software_variant }}"
        software_version:
        template_params: []
        failure_policy: "ABORT_TARGET_ON_ERROR"
        version: "{{ default_template_version }}"
        tags: []
