---
# Each "host" in the nd group is a FABRIC, not a device; Ansible reaches it through
# Nexus Dashboard. The DC fabric's data model is in playbooks/host_vars/<host name>/,
# so the host name must equal the fabric name.
all:
  children:
    nd:
      hosts:
        # The DC VXLAN EVPN fabric this pipeline builds.
        TECOPS-DC1:
          ansible_host: 198.18.133.101
        # The External fabric holding the IP Core switches, created in Monitor Mode.
        # It has no data model; its settings are in group_vars/all/dc_external_settings.yml.
        TECOPS-External:
          ansible_host: 198.18.133.101

    # Devices reached directly over SSH. Both groups are empty on purpose: stages
    # add their hosts at run time from group_vars/all, so each list lives in one place.
    dc_ssh:
      children:
        # The DC switches (serial discovery and cleanup).
        dc_fabric_switches:
          hosts: {}
        # The IP Core switches (serial discovery only).
        dc_core_switches:
          hosts: {}
