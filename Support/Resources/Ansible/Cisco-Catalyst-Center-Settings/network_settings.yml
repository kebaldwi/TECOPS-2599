---
- name: Apply Network Settings and Device Credentials from settings.json
  hosts: catalyst_center
  gather_facts: no
  vars_files:
    - vault.yml
  vars:
    DEBUG: "{{ lookup('env', 'DEBUG') | default(false) | bool }}"

  module_defaults:
    cisco.dnac.network_settings_workflow_manager:
      dnac_host: "{{ dnac_host }}"
      dnac_username: "{{ dnac_username }}"
      dnac_password: "{{ dnac_password }}"
      dnac_verify: "{{ dnac_verify }}"
      dnac_port: "{{ dnac_port }}"
      dnac_version: "{{ dnac_version }}"
      dnac_debug: "{{ dnac_debug }}"
      dnac_log_level: "{{ dnac_log_level }}"
      dnac_log: "{{ dnac_log }}"
    cisco.dnac.device_credential_workflow_manager:
      dnac_host: "{{ dnac_host }}"
      dnac_username: "{{ dnac_username }}"
      dnac_password: "{{ dnac_password }}"
      dnac_verify: "{{ dnac_verify }}"
      dnac_port: "{{ dnac_port }}"
      dnac_version: "{{ dnac_version }}"
      dnac_debug: "{{ dnac_debug }}"
      dnac_log_level: "{{ dnac_log_level }}"
      dnac_log: "{{ dnac_log }}"

  tasks:

    # ── Step 1: Load input data ───────────────────────────────────────────────
    # Resolve the settings_json_path to an absolute path.
    # Absolute paths (starting with /) pass through unchanged;
    # relative paths are resolved from the playbook directory.
    - name: Resolve settings_json_path to absolute
      set_fact:
        _resolved_json_path: >-
          {{ settings_json_path if settings_json_path.startswith('/')
             else (playbook_dir + '/' + settings_json_path) }}

    - name: Load settings input JSON
      ansible.builtin.slurp:
        src: "{{ _resolved_json_path }}"
      register: _json_raw

    - name: Parse settings input JSON
      set_fact:
        settings_data: "{{ _json_raw.content | b64decode | from_json }}"

    - name: Validate that project key exists in input data
      assert:
        that: settings_data.project is defined and settings_data.project | length > 0
        fail_msg: "Input JSON must contain a non-empty 'project' list."
        success_msg: "Input data loaded — {{ settings_data.project | length }} entries found."

    # ── Step 2: Derive site names from hierarchy fields ───────────────────────
    #
    # Each settings.json entry uses four positional fields to identify the
    # target site.  The deepest non-null level determines the site path:
    #
    #   HierarchyFloor set  → Parent/Area/Bldg/Floor
    #   HierarchyBldg set   → Parent/Area/Bldg
    #   HierarchyArea set   → Parent/Area
    #   (none set)          → HierarchyParent  (e.g. "Global")
    #
    # Sample (BGP_EVPN/Settings/settings.json):
    #
    #   Entry 0: HierarchyParent=Global,       Area=null  → "Global"
    #   Entry 1: HierarchyParent=Global,       Area=PODS  → "Global/PODS"
    #   Entry 2: HierarchyParent=Global/PODS,  Area=POD 0,
    #            Bldg=Building P0, Floor=Floor 1           → "Global/PODS/POD 0/Building P0/Floor 1"
    #
    - name: Build site name list from entries
      set_fact:
        site_names: >-
          {%- set ns = namespace(result=[]) -%}
          {%- for entry in settings_data.project -%}
            {%- if entry.HierarchyFloor -%}
              {%- set s = entry.HierarchyParent + '/' + entry.HierarchyArea + '/' + entry.HierarchyBldg + '/' + entry.HierarchyFloor -%}
            {%- elif entry.HierarchyBldg -%}
              {%- set s = entry.HierarchyParent + '/' + entry.HierarchyArea + '/' + entry.HierarchyBldg -%}
            {%- elif entry.HierarchyArea -%}
              {%- set s = entry.HierarchyParent + '/' + entry.HierarchyArea -%}
            {%- else -%}
              {%- set s = entry.HierarchyParent -%}
            {%- endif -%}
            {%- set ns.result = ns.result + [s] -%}
          {%- endfor -%}
          {{ ns.result }}

    - name: --DEBUG-- Site names derived from settings.json
      when: DEBUG
      debug:
        msg: "{{ site_names }}"

    # ── Step 3: Build network settings payload list ──────────────────────────────
    #
    # settings.json uses module-native field names under the network_settings
    # key, so this step is a direct pass-through.  Top-level null values
    # (network_aaa: null, client_and_endpoint_aaa: null) are filtered out so
    # the module does not attempt to configure AAA at sites that have none.
    #
    - name: Build network management settings payload list
      set_fact:
        network_settings_list: >-
          {%- set ns = namespace(result=[]) -%}
          {%- for i in range(settings_data.project | length) -%}
            {%- set entry    = settings_data.project[i] -%}
            {%- set sitename = site_names[i] -%}
            {%- set cfg = entry.network_settings | dict2items
                          | selectattr('value', 'ne', None)
                          | list | items2dict -%}
            {%- if cfg | length > 0 -%}
              {%- set ns.result = ns.result + [{'site_name': sitename, 'settings': cfg}] -%}
            {%- endif -%}
          {%- endfor -%}
          {{ ns.result }}

    - name: --DEBUG-- Network settings payload list
      when: DEBUG
      debug:
        msg: "{{ network_settings_list }}"

    - name: Validate network settings list is non-empty
      assert:
        that: network_settings_list | length > 0
        fail_msg: "No network settings found in input JSON — check that fields are non-null."
        success_msg: "{{ network_settings_list | length }} site(s) have settings to apply."

    # ── Step 4: Build global device credential list ──────────────────────────────
    #
    # settings.json entries with a non-null device_credentials block supply the
    # exact global_credential_details structure expected by the module.
    #
    - name: Build global credential payload list
      set_fact:
        credential_list: >-
          {%- set ns = namespace(result=[]) -%}
          {%- for entry in settings_data.project -%}
            {%- if entry.device_credentials -%}
              {%- set ns.result = ns.result + [{'global_credential_details': entry.device_credentials}] -%}
            {%- endif -%}
          {%- endfor -%}
          {{ ns.result }}

    - name: --DEBUG-- Global credential payload list
      when: DEBUG
      debug:
        msg: "{{ credential_list }}"

    # ── Step 5: Build credential-to-site assignment list ───────────────────────
    #
    # settings.json entries with a non-null assign_credentials block supply the
    # exact assign_credentials_to_site structure expected by the module.
    #
    - name: Build credential-to-site assignment list
      set_fact:
        credential_assign_list: >-
          {%- set ns = namespace(result=[]) -%}
          {%- for entry in settings_data.project -%}
            {%- if entry.assign_credentials -%}
              {%- set ns.result = ns.result + [{'assign_credentials_to_site': entry.assign_credentials}] -%}
            {%- endif -%}
          {%- endfor -%}
          {{ ns.result }}

    - name: --DEBUG-- Credential assignment payload list
      when: DEBUG
      debug:
        msg: "{{ credential_assign_list }}"

    # ── Step 6: Apply network settings ────────────────────────────────────────
    #
    # Applies DNS, DHCP, NTP, SNMP, Syslog, NetFlow, Banner, and AAA settings
    # at each site defined in the JSON.  The module is idempotent — existing
    # settings that already match are not re-pushed.
    #
    - name: Apply network settings at site "{{ item.site_name }}"
      cisco.dnac.network_settings_workflow_manager:
        state: merged
        config:
          - network_management_details:
              - "{{ item }}"
      loop: "{{ network_settings_list }}"
      register: settings_results

    - name: --DEBUG-- Network settings results
      when: DEBUG
      debug:
        msg: "{{ settings_results }}"

    # ── Step 7: Create / update global device credentials ─────────────────────
    #
    # Creates CLI, SNMPv2c R/O, SNMPv2c R/W and NETCONF credentials globally.
    # Skipped automatically if credential_list is empty.
    #
    - name: Create/update global device credentials
      cisco.dnac.device_credential_workflow_manager:
        state: merged
        config:
          - "{{ item }}"
      loop: "{{ credential_list }}"
      when: credential_list | length > 0
      register: credential_results

    - name: --DEBUG-- Credential create results
      when: DEBUG and credential_list | length > 0
      debug:
        msg: "{{ credential_results }}"

    # ── Step 8: Assign credentials to sites ───────────────────────────────────
    #
    # Associates the created credentials with each non-Global site that has
    # device credential data in the JSON.
    # Skipped automatically if no site-level assignments are defined.
    #
    - name: Assign credentials to site "{{ item.assign_credentials_to_site.site_name | join(', ') }}"
      cisco.dnac.device_credential_workflow_manager:
        state: merged
        config:
          - "{{ item }}"
      loop: "{{ credential_assign_list }}"
      when: credential_assign_list | length > 0
      register: assign_results

    - name: --DEBUG-- Credential assignment results
      when: DEBUG and credential_assign_list | length > 0
      debug:
        msg: "{{ assign_results }}"

    # ── Step 9: Summary ────────────────────────────────────────────────────────
    - name: Settings synchronization complete
      debug:
        msg:
          - "Network settings applied successfully"
          - "Sites configured: {{ network_settings_list | map(attribute='site_name') | list | join(', ') }}"
          - "Global credential sets created: {{ credential_list | length }}"
          - "Site credential assignments: {{ credential_assign_list | length }}"
